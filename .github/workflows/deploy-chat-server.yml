name: Deploy Chat Server

on:
  push:
    branches: [main]
    paths:
      - 'chat-server/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: chat-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: chat-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /var/www/chat-server/dist /var/www/chat-server/logs
            chmod -R 755 /var/www/chat-server

      - name: Sync dist
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avz --delete
          path: chat-server/dist/
          remote_path: /var/www/chat-server/dist/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USERNAME }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Sync config
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avz
          path: chat-server/package.json chat-server/package-lock.json chat-server/ecosystem.config.js
          remote_path: /var/www/chat-server/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USERNAME }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Install & Reload
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/chat-server
            npm ci --omit=dev
            pm2 reload ecosystem.config.js || pm2 start ecosystem.config.js
            pm2 save
            pm2 list